name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional release version; empty selects the next fork tag"
        required: false
        type: string

permissions:
  contents: read

jobs:
  # buddy-run's translation of each agent's output, on recorded runs (linux/test/run.sh); jq comes with the runner
  helper-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test the helper on recorded agent output
        run: bash linux/test/run.sh

  apk:
    needs: helper-tests
    permissions:
      contents: write
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && 'buddy-release' || format('build-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: true # proot and libandroid-shmem (third_party/)

      - name: Prepare manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          KEYSTORE_BASE64: ${{ secrets.BUDDY_KEYSTORE_BASE64 }}
          SIGNER: ${{ secrets.BUDDY_SIGNER_SHA256 }}
          STORE_PASSWORD: ${{ secrets.BUDDY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUDDY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BUDDY_KEY_PASSWORD }}
        run: |
          test "$GITHUB_REPOSITORY" = zees-dev/buddy-android
          test "$GITHUB_REF" = refs/heads/develop
          test -n "$KEYSTORE_BASE64"
          test -n "$SIGNER"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          bash .github/release/prepare.sh

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21.0.11+10"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      # proot, talloc, libandroid-shmem and the pty helper, from source with a fixed NDK
      - name: Build native libraries
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" </dev/null >/dev/null
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" native/build.sh
        env:
          NDK_VERSION: 27.2.12479018

      # Only manual releases receive signing material; ordinary CI stays unsigned.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BUDDY_KEYSTORE_BASE64 }}
        if: github.event_name == 'workflow_dispatch' && env.KEYSTORE_BASE64 != ''
        run: |
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BUDDY_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # github: the release here. fdroid: F-Droid builds it from this source too, and ships this signed copy when its
      # own build comes out identical (reproducible builds), so users can switch between the two.
      - name: Build release APKs (GitHub and F-Droid)
        env:
          BUDDY_KEYSTORE_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.BUDDY_KEYSTORE_PASSWORD || '' }}
          BUDDY_KEY_ALIAS: ${{ github.event_name == 'workflow_dispatch' && secrets.BUDDY_KEY_ALIAS || '' }}
          BUDDY_KEY_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.BUDDY_KEY_PASSWORD || '' }}
        run: ./gradlew --no-daemon assembleGithubRelease assembleFdroidRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          apk=$(find app/build/outputs/apk/github/release -name '*.apk' | head -1)
          cp "$apk" "dist/buddy-${RELEASE_NAME:-${GITHUB_REF_NAME//\//-}}.apk"
          # Stable download name for the fork updater.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then cp "$apk" dist/buddy.apk; fi
          fd=$(find app/build/outputs/apk/fdroid/release -name '*.apk' | head -1)
          # named so nobody picks it by mistake: it doesn't update itself (F-Droid's Binaries line must match this name)
          cp "$fd" "dist/fdroid-check-only-${GITHUB_REF_NAME//\//-}.apk"
          echo "FDROID_APK=$PWD/dist/fdroid-check-only-${GITHUB_REF_NAME//\//-}.apk" >> "$GITHUB_ENV"
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: buddy-apk
          path: dist/*.apk

      - name: Verify manual release APK
        if: github.event_name == 'workflow_dispatch'
        env:
          BUDDY_SIGNER_SHA256: ${{ secrets.BUDDY_SIGNER_SHA256 }}
        run: bash .github/release/verify.sh dist/buddy.apk

      # Rebuild the exact versioned source before anything is published.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          ref: ${{ github.sha }}
          path: rebuild-check # a second copy at another path, as F-Droid's build machine would have

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
          python-version: "3.13.9"

      - name: Check the F-Droid APK is reproducible
        run: |
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH" # apksigner
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            cp app/src/main/java/app/buddy/assistant/BuildInfo.java rebuild-check/app/src/main/java/app/buddy/assistant/BuildInfo.java
          fi
          cd rebuild-check
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" native/build.sh
          env -u BUDDY_KEYSTORE ./gradlew --no-daemon assembleFdroidRelease
          unsigned=$(find app/build/outputs/apk/fdroid/release -name '*.apk' | head -1)
          uv run --project .github/repro --locked --no-dev apksigcopier compare --unsigned "$FDROID_APK" "$unsigned"
          echo "The F-Droid APK is reproducible"

      - name: Publish manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          BUDDY_SIGNER_SHA256: ${{ secrets.BUDDY_SIGNER_SHA256 }}
        run: |
          rm -rf rebuild-check
          bash .github/release/publish.sh

      - name: Remove decoded signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
