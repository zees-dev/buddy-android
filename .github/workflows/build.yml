name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the APK to a GitHub release on tags

jobs:
  # buddy-run's translation of each agent's output, on recorded runs (linux/test/run.sh); jq comes with the runner
  helper-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test the helper on recorded agent output
        run: bash linux/test/run.sh

  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true # proot and libandroid-shmem (third_party/)

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21.0.11+10"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      # proot, talloc, libandroid-shmem and the pty helper, from source with a fixed NDK
      - name: Build native libraries
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" native/build.sh
        env:
          NDK_VERSION: 27.2.12479018

      # Release signing is optional: add the BUDDY_KEYSTORE_BASE64 and BUDDY_KEYSTORE_PASSWORD
      # repository secrets to get a signed APK; otherwise the APK is unsigned.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BUDDY_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BUDDY_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # github: the release here. fdroid: F-Droid builds it from this source too, and ships this signed copy when its
      # own build comes out identical (reproducible builds), so users can switch between the two.
      - name: Build release APKs (GitHub and F-Droid)
        env:
          BUDDY_KEYSTORE_PASSWORD: ${{ secrets.BUDDY_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleGithubRelease assembleFdroidRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          apk=$(find app/build/outputs/apk/github/release -name '*.apk' | head -1)
          cp "$apk" "dist/buddy-${GITHUB_REF_NAME//\//-}.apk"
          # fixed name too, so releases/latest/download/buddy.apk always gets the newest version
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then cp "$apk" dist/buddy.apk; fi
          fd=$(find app/build/outputs/apk/fdroid/release -name '*.apk' | head -1)
          # named so nobody picks it by mistake: it doesn't update itself (F-Droid's Binaries line must match this name)
          cp "$fd" "dist/fdroid-check-only-${GITHUB_REF_NAME//\//-}.apk"
          echo "FDROID_APK=$PWD/dist/fdroid-check-only-${GITHUB_REF_NAME//\//-}.apk" >> "$GITHUB_ENV"
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: buddy-apk
          path: dist/*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # a release made by hand first (with its own notes) just gets the CI-built APKs attached
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk --title "Buddy $GITHUB_REF_NAME" --generate-notes
          fi
          # which of the APKs to download, at the end of the notes (once)
          notes=$(gh release view "$GITHUB_REF_NAME" --json body -q .body)
          case "$notes" in
            *"Which file?"*) ;;
            *) printf '%s\n\n%s\n' "$notes" "**Which file?** Download \`buddy.apk\`: it updates itself. \`fdroid-check-only-$GITHUB_REF_NAME.apk\` is only there for F-Droid's reproducible-build check, and doesn't update itself." \
                 | gh release edit "$GITHUB_REF_NAME" --notes-file - ;;
          esac

      # What F-Droid will do: build the fdroid APK again, unsigned, somewhere else, and check it matches the signed one
      # above but for the signature. After publishing, so a mismatch shows up red without holding the release back.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          path: rebuild-check # a second copy at another path, as F-Droid's build machine would have

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
          python-version: "3.13.9"

      - name: Check the F-Droid APK is reproducible
        run: |
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH" # apksigner
          cd rebuild-check
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" native/build.sh
          env -u BUDDY_KEYSTORE ./gradlew --no-daemon assembleFdroidRelease
          unsigned=$(find app/build/outputs/apk/fdroid/release -name '*.apk' | head -1)
          uv run --project .github/repro --locked --no-dev apksigcopier compare --unsigned "$FDROID_APK" "$unsigned"
          echo "The F-Droid APK is reproducible"
